
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f8;color:#1a202c;min-height:100vh}
:root{
  --primary:#1a56db;--primary-dark:#1e40af;--primary-light:#ebf5ff;
  --success:#059669;--success-light:#ecfdf5;
  --warning:#d97706;--warning-light:#fffbeb;
  --danger:#dc2626;--danger-light:#fef2f2;
  --gray:#6b7280;--gray-light:#f9fafb;
  --border:#e5e7eb;--card:#ffffff;
  --sidebar-bg:#0f172a;--sidebar-text:#94a3b8;--sidebar-active:#1a56db;
}
/* Layout */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:240px;background:var(--sidebar-bg);display:flex;flex-direction:column;flex-shrink:0;transition:width .3s}
.sidebar-logo{padding:20px 16px;border-bottom:1px solid #1e293b}
.sidebar-logo h2{color:#f1f5f9;font-size:18px;font-weight:700;letter-spacing:-0.5px}
.sidebar-logo span{color:var(--sidebar-active);font-size:13px}
.sidebar-nav{padding:12px 8px;flex:1;overflow-y:auto}
.nav-section{font-size:10px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:1px;padding:8px 8px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--sidebar-text);font-size:13px;margin-bottom:2px;transition:all .2s}
.nav-item:hover{background:#1e293b;color:#f1f5f9}
.nav-item.active{background:var(--sidebar-active);color:#fff}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.sidebar-footer{padding:12px;border-top:1px solid #1e293b}
.user-pill{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;background:#1e293b;cursor:pointer}
.user-pill .avatar{width:32px;height:32px;border-radius:50%;background:var(--sidebar-active);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0}
.user-pill .info{min-width:0}
.user-pill .name{color:#f1f5f9;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-pill .role{color:var(--sidebar-text);font-size:10px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar h1{font-size:16px;font-weight:600;color:#111827}
.topbar-actions{display:flex;align-items:center;gap:8px}
.content{flex:1;overflow-y:auto;padding:24px}
/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.card-sm{padding:16px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px}
.stat-label{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;font-weight:600}
.stat-value{font-size:24px;font-weight:700;color:#111827}
.stat-sub{font-size:12px;color:var(--gray);margin-top:4px}
.stat-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.stat-icon svg{width:18px;height:18px}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .2s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:#fff;color:#374151;border:1px solid var(--border)}
.btn-outline:hover{background:var(--gray-light)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:6px}
/* Table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;background:#f8fafc;color:#6b7280;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid #f3f4f6;color:#374151}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
/* Badges */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-success{background:var(--success-light);color:var(--success)}
.badge-warning{background:var(--warning-light);color:var(--warning)}
.badge-danger{background:var(--danger-light);color:var(--danger)}
.badge-blue{background:#eff6ff;color:#1d4ed8}
.badge-gray{background:#f3f4f6;color:#6b7280}
/* Forms */
.form-group{margin-bottom:16px}
label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:6px}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:#111827;background:#fff;outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,86,219,.1)}
textarea{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 100%)}
.login-card{background:#fff;border-radius:20px;padding:40px;width:100%;max-width:400px;box-shadow:0 25px 50px rgba(0,0,0,.3)}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo h1{font-size:28px;font-weight:800;color:#0f172a}
.login-logo h1 span{color:var(--primary)}
.login-logo p{font-size:13px;color:var(--gray);margin-top:4px}
.tabs{display:flex;gap:4px;background:#f3f4f6;padding:4px;border-radius:10px;margin-bottom:20px}
.tab{flex:1;padding:8px;text-align:center;font-size:13px;font-weight:500;border-radius:8px;cursor:pointer;color:var(--gray);transition:all .2s}
.tab.active{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.1)}
/* OTP */
.otp-wrap{display:flex;gap:8px;justify-content:center;margin:16px 0}
.otp-input{width:44px;height:48px;text-align:center;font-size:20px;font-weight:700;border:2px solid var(--border);border-radius:10px;outline:none}
.otp-input:focus{border-color:var(--primary)}
/* Progress bar */
.progress-bar{height:6px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:var(--primary);border-radius:999px;transition:width .5s}
/* Loan card */
.loan-card{border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.loan-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
/* QR */
.qr-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center}
.qr-visual{width:140px;height:140px;margin:12px auto;display:grid;grid-template-columns:repeat(10,1fr);gap:1px}
.qr-cell{border-radius:1px}
/* Notification dot */
.notif-dot{width:8px;height:8px;background:#ef4444;border-radius:50%;display:inline-block;margin-left:4px}
/* Search */
.search-wrap{position:relative}
.search-wrap input{padding-left:36px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--gray)}
.search-icon svg{width:14px;height:14px}
/* Modal overlay */
.modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;border-radius:0}
.modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;box-shadow:0 25px 50px rgba(0,0,0,.3)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-header h3{font-size:16px;font-weight:700}
.close-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--gray)}
/* Section titles */
.section-title{font-size:15px;font-weight:700;color:#111827;margin-bottom:16px}
.section-subtitle{font-size:13px;color:var(--gray);margin-bottom:20px}
/* Avatar */
.avatar-lg{width:64px;height:64px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--primary);margin-bottom:12px}
/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:#f3f4f6;border-radius:20px;font-size:11px;color:#374151;cursor:pointer}
.chip.active{background:var(--primary);color:#fff}
/* EMI table */
.emi-row-paid td{color:#059669;background:#f0fdf4}
.emi-row-upcoming td{color:#374151}
.emi-row-missed td{color:#dc2626;background:#fef2f2}
/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
/* Responsive content areas */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}.sidebar{width:200px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useRef,useCallback}=React;

// ── DATA ──────────────────────────────────────────────────────────────
const ADMINS=[
  {id:'A1',name:'Ramesh Kumar',mobile:'9876543210',email:'ramesh@bilasodhi.com',role:'admin',assignedMembers:['M1','M2','M3','M4','M5','M6','M7','M8','M9','M10']},
  {id:'A2',name:'Sunita Sharma',mobile:'9876543211',email:'sunita@bilasodhi.com',role:'admin',assignedMembers:['M11','M12','M13','M14','M15','M16','M17','M18','M19','M20']},
];
const generateMembers=()=>{
  const names=['Arjun Singh','Priya Patel','Rohit Verma','Anjali Gupta','Vikram Rao','Meena Joshi','Deepak Shah','Kavita Nair','Suresh Pillai','Rekha Iyer','Amit Yadav','Pooja Mishra','Rahul Pandey','Sunita Das','Kiran Mehta','Satish Reddy','Lalita Rao','Mahesh Patil','Geeta Khanna','Dinesh Tripathi'];
  const statuses=['active','active','active','active','loan-active'];
  return names.map((name,i)=>({
    id:'M'+(i+1),adminId:i<10?'A1':'A2',
    name,mobile:'98'+String(7000000+i*13579).slice(0,8),
    email:name.split(' ')[0].toLowerCase()+'@email.com',
    ifsc:'SBIN000'+(1234+i),bank:'SBI',
    account:'XXXX'+String(1000+i),
    status:statuses[i%statuses.length],
    joined:'2024-0'+(1+(i%9))+'-'+(10+(i%18)),
    photo:null,
    loan:i%3===0?{id:'L'+(i+1),amount:(i+1)*1000+5000,duration:i%2===0?12:20,paid:(i%5)*1000,status:i<15?'active':'cleared',appliedDate:'2024-03-15',approvedDate:'2024-03-18'}:null
  }));
};
const MEMBERS=generateMembers();
const LOANS=MEMBERS.filter(m=>m.loan).map(m=>m.loan);

const initState={
  screen:'login',currentUser:null,loginStep:'input',loginTab:'mobile',loginValue:'',otp:'',otpSent:false,
  page:'dashboard',modal:null,
  members:MEMBERS,loans:LOANS,
  searchTerm:'',filterStatus:'all',
  loanForm:{amount:'',duration:'',purpose:''},
  paymentForm:{amount:'',memberId:'',note:''},
  notification:{show:false,msg:'',type:'success'},
};

// ── HELPERS ───────────────────────────────────────────────────────────
const formatCurrency=n=>'₹'+Number(n).toLocaleString('en-IN');
const formatDate=d=>new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
const getInitials=name=>name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const calcEMI=(loan)=>Math.ceil(loan.amount/loan.duration);
const calcRemaining=(loan)=>loan.amount-loan.paid;
const calcProgress=(loan)=>Math.round((loan.paid/loan.amount)*100);

// Generate QR pattern (deterministic pseudo-random)
const makeQR=(seed)=>{
  const cells=[];
  for(let i=0;i<100;i++){
    const v=(seed*7+i*13+i*i*3)%7;
    cells.push(v<3);
  }
  return cells;
};

// ── ICONS ─────────────────────────────────────────────────────────────
const Icon=({d,size=16,stroke=2})=>React.createElement('svg',{width:size,height:size,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:stroke,strokeLinecap:'round',strokeLinejoin:'round'},React.createElement('path',{d}));
const icons={
  dashboard:'M4 5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5zm10 0a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V5zM4 15a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-4zm10 0a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-4z',
  members:'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm8 0c0 1.657-1.343 3-3 3',
  loan:'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14H9v-2h4v2zm0-4H9V7h4v5z',
  payment:'M2 10h20M6 14h2M10 14h4M6 6h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z',
  reports:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM14 2v6h6M16 13H8M16 17H8M10 9H8',
  profile:'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
  logout:'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9',
  notify:'M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0',
  search:'M21 21l-6-6m2-5a7 7 0 1 1-14 0 7 7 0 0 1 14 0',
  plus:'M12 5v14M5 12h14',
  check:'M20 6L9 17l-5-5',
  x:'M18 6L6 18M6 6l12 12',
  eye:'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
  download:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3',
  filter:'M22 3H2l8 9.46V19l4 2v-8.54L22 3z',
  qr:'M3 3h7v7H3zm11 0h7v7h-7zM3 14h7v7H3zm13 0h2v2h-2zm0 4h2v2h-2zm-4-4h2v2h-2zm4-4h2v2h-2zm0 8h2v2h-2zm-8-8h2v2h-2z',
  edit:'M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z',
  arrow:'M5 12h14M12 5l7 7-7 7',
};

// ── COMPONENTS ────────────────────────────────────────────────────────
function Notification({show,msg,type,onClose}){
  useEffect(()=>{if(show){const t=setTimeout(onClose,3000);return()=>clearTimeout(t)}},[show]);
  if(!show)return null;
  return React.createElement('div',{style:{position:'fixed',top:20,right:20,zIndex:999,background:type==='success'?'#059669':type==='error'?'#dc2626':'#d97706',color:'#fff',padding:'12px 20px',borderRadius:10,fontSize:13,fontWeight:500,boxShadow:'0 8px 24px rgba(0,0,0,.2)',display:'flex',alignItems:'center',gap:10}},
    React.createElement(Icon,{d:type==='success'?icons.check:icons.x,size:16}),msg,
    React.createElement('span',{onClick:onClose,style:{cursor:'pointer',marginLeft:8,opacity:.8}},'×')
  );
}

function Avatar({name,size=32,fontSize=12}){
  const colors=['#1a56db','#059669','#d97706','#7c3aed','#db2777','#0891b2'];
  const color=colors[name.charCodeAt(0)%colors.length];
  return React.createElement('div',{style:{width:size,height:size,borderRadius:'50%',background:color+'22',display:'flex',alignItems:'center',justifyContent:'center',fontSize,fontWeight:700,color,flexShrink:0}},getInitials(name));
}

function StatCard({label,value,sub,color='#1a56db',icon}){
  return React.createElement('div',{className:'stat-card'},
    React.createElement('div',{className:'stat-icon',style:{background:color+'15',color}},React.createElement(Icon,{d:icons[icon]||icons.dashboard,size:18})),
    React.createElement('div',{className:'stat-label'},label),
    React.createElement('div',{className:'stat-value'},value),
    sub&&React.createElement('div',{className:'stat-sub'},sub)
  );
}

function Badge({status}){
  const map={active:['badge-success','Active'],'loan-active':['badge-blue','Loan Active'],cleared:['badge-gray','Cleared'],pending:['badge-warning','Pending'],approved:['badge-success','Approved'],rejected:['badge-danger','Rejected']};
  const [cls,label]=map[status]||['badge-gray',status];
  return React.createElement('span',{className:`badge ${cls}`},label);
}

// ── QR CODE ───────────────────────────────────────────────────────────
function QRCode({memberId,name}){
  const seed=memberId.charCodeAt(1)||42;
  const cells=makeQR(seed);
  return React.createElement('div',{className:'qr-box'},
    React.createElement('div',{style:{fontSize:12,color:'#6b7280',marginBottom:8}},'Scan to Pay'),
    React.createElement('div',{className:'qr-visual'},
      cells.map((filled,i)=>React.createElement('div',{key:i,className:'qr-cell',style:{background:filled?'#0f172a':'#f8fafc',aspectRatio:'1'}}))
    ),
    React.createElement('div',{style:{fontSize:11,fontWeight:600,color:'#374151',marginTop:8}},'BilaSodhi Loan Payment'),
    React.createElement('div',{style:{fontSize:10,color:'#6b7280'}},'Member: '+name)
  );
}

// ── EMI SCHEDULE ──────────────────────────────────────────────────────
function EMISchedule({loan,member}){
  if(!loan)return null;
  const emi=calcEMI(loan);
  const paidMonths=Math.floor(loan.paid/emi);
  const rows=Array.from({length:loan.duration},(_, i)=>{
    const month=i+1;
    const due=new Date('2024-03-18');due.setMonth(due.getMonth()+month);
    const status=i<paidMonths?'paid':i===paidMonths?'upcoming':'pending';
    return{month,due:due.toLocaleDateString('en-IN',{month:'short',year:'2-digit'}),emi,status};
  });
  return React.createElement('div',null,
    React.createElement('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}},
      React.createElement('div',{className:'section-title',style:{margin:0}},'EMI Schedule'),
      React.createElement('div',{style:{fontSize:12,color:'#6b7280'}},paidMonths+' of '+loan.duration+' paid')
    ),
    React.createElement('div',{className:'progress-bar',style:{marginBottom:16}},
      React.createElement('div',{className:'progress-fill',style:{width:calcProgress(loan)+'%'}})
    ),
    React.createElement('div',{className:'table-wrap',style:{maxHeight:280,overflowY:'auto'}},
      React.createElement('table',null,
        React.createElement('thead',null,React.createElement('tr',null,
          React.createElement('th',null,'Month'),React.createElement('th',null,'Due Date'),React.createElement('th',null,'EMI Amount'),React.createElement('th',null,'Status')
        )),
        React.createElement('tbody',null,rows.map(r=>
          React.createElement('tr',{key:r.month,className:'emi-row-'+r.status},
            React.createElement('td',null,'Month '+r.month),
            React.createElement('td',null,r.due),
            React.createElement('td',null,formatCurrency(r.emi)),
            React.createElement('td',null,React.createElement('span',{className:'badge '+(r.status==='paid'?'badge-success':r.status==='upcoming'?'badge-blue':'badge-gray')},r.status==='paid'?'Paid':r.status==='upcoming'?'Next Due':'Pending'))
          )
        ))
      )
    )
  );
}

// ── LOGIN SCREEN ──────────────────────────────────────────────────────
function LoginScreen({state,dispatch}){
  const[otp,setOtp]=useState(['','','','']);
  const otpRefs=[useRef(),useRef(),useRef(),useRef()];
  const handleOTPInput=(i,v)=>{
    const newOtp=[...otp];newOtp[i]=v.slice(-1);setOtp(newOtp);
    if(v&&i<3)otpRefs[i+1].current.focus();
  };
  const handleSendOTP=()=>{
    if(!state.loginValue){dispatch({type:'notify',msg:'Please enter mobile or email',notifType:'error'});return;}
    dispatch({type:'set',key:'otpSent',val:true});
    dispatch({type:'notify',msg:'OTP sent: 1234 (demo)',notifType:'success'});
  };
  const handleVerify=()=>{
    const enteredOTP=otp.join('');
    if(enteredOTP==='1234'||enteredOTP.length===4){
      const val=state.loginValue.toLowerCase();
      const admin=ADMINS.find(a=>a.mobile===state.loginValue||a.email===val);
      const member=MEMBERS.find(m=>m.mobile===state.loginValue||m.email===val);
      if(admin){dispatch({type:'login',user:{...admin,role:'admin'}});}
      else if(member){dispatch({type:'login',user:{...member,role:'member'}});}
      else{
        // Default demo

// ── QR PAGE ───────────────────────────────────────────────────────────
function QRPage({user,dispatch}){
  const[amount,setAmount]=useState('');
  const[paid,setPaid]=useState(false);
  const handlePay=()=>{
    if(!amount||Number(amount)<=0){dispatch({type:'notify',msg:'Enter valid amount',notifType:'error'});return;}
    if(!user.loan){dispatch({type:'notify',msg:'No active loan',notifType:'error'});return;}
    dispatch({type:'addPayment',memberId:user.id,amount:Number(amount)});
    setPaid(true);
    dispatch({type:'notify',msg:'Payment of '+formatCurrency(amount)+' successful!',notifType:'success'});
    setTimeout(()=>setPaid(false),3000);
    setAmount('');
  };
  return React.createElement('div',{style:{maxWidth:480,margin:'0 auto'}},
    React.createElement('h2',{style:{fontSize:18,fontWeight:700,marginBottom:20}},'QR Payment'),

// ── REDUCER ───────────────────────────────────────────────────────────
function reducer(state,action){
  switch(action.type){
    case 'set':return{...state,[action.key]:action.val};
    case 'login':return{...state,screen:'app',currentUser:action.user,page:'dashboard'};
    case 'logout':return{...initState,screen:'login'};
    case 'navigate':return{...state,page:action.page};
    case 'notify':return{...state,notification:{show:true,msg:action.msg,type:action.notifType||'success'}};
    case 'clearNotify':return{...state,notification:{...state.notification,show:false}};
    case 'addPayment':{
      const newMembers=state.members.map(m=>{
        if(m.id!==action.memberId)return m;
        const newPaid=Math.min(m.loan.paid+action.amount,m.loan.amount);
        return{...m,loan:{...m.loan,paid:newPaid,status:newPaid>=m.loan.amount?'cleared':'active'}};
      });
      const cu=state.currentUser?.id===action.memberId?{...state.currentUser,loan:{...state.currentUser.loan,paid:Math.min(state.currentUser.loan.paid+action.amount,state.currentUser.loan.amount)}}:state.currentUser;
      return{...state,members:newMembers,currentUser:cu};
    }
    case 'applyLoan':{
      const newMembers=state.members.map(m=>m.id===action.userId?{...m,loan:action.loan}:m);
      const cu={...state.currentUser,loan:action.loan};
      return{...state,members:newMembers,currentUser:cu};
    }
    case 'updateProfile':{
      const newMembers=state.members.map(m=>m.id===action.userId?{...m,...action.data}:m);
      const cu={...state.currentUser,...action.data};
      return{...state,members:newMembers,currentUser:cu};
    }
    default:return state;
  }
}

// ── APP ───────────────────────────────────────────────────────────────
function App(){
  const[state,dispatch]=useState(()=>initState);
  const act=useCallback((action)=>dispatch(prev=>reducer(prev,action)),[]);
  const{screen,currentUser,page,members,notification}=state;

  if(screen==='login')return React.createElement('div',null,
    React.createElement(Notification,{...notification,onClose:()=>act({type:'clearNotify'})}),
    React.createElement(LoginScreen,{state,dispatch:act})
  );

  const topbarTitles={dashboard:'Dashboard',members:'Members',loans:'Loan Management',payments:'Payment History',reports:'Reports',profile:'My Profile','my-loan':'My Loan','qr-pay':'QR Payment'};
  const renderPage=()=>{
    if(currentUser.role==='admin'){
      switch(page){
        case 'dashboard':return React.createElement(AdminDashboard,{user:currentUser,members,loans:state.loans,onAction:p=>act({type:'navigate',page:p})});
        case 'members':return React.createElement(MembersPage,{user:currentUser,members,dispatch:act});
        case 'loans':return React.createElement(LoansPage,{user:currentUser,members,dispatch:act});
        case 'payments':return React.createElement(PaymentsPage,{user:currentUser,members,dispatch:act});
        case 'reports':return React.createElement(ReportsPage,{user:currentUser,members});
        case 'profile':return React.createElement(ProfilePage,{user:currentUser,dispatch:act});
        default:return React.createElement(AdminDashboard,{user:currentUser,members,loans:state.loans,onAction:p=>act({type:'navigate',page:p})});
      }
    }else{
      switch(page){
        case 'dashboard':return React.createElement(MemberDashboard,{user:currentUser,onAction:p=>act({type:'navigate',page:p})});
        case 'my-loan':return React.createElement(MyLoanPage,{user:currentUser,dispatch:act});
        case 'payments':return React.createElement(PaymentsPage,{user:currentUser,members,dispatch:act});
        case 'qr-pay':return React.createElement(QRPage,{user:currentUser,dispatch:act});
        case 'profile':return React.createElement(ProfilePage,{user:currentUser,dispatch:act});
        default:return React.createElement(MemberDashboard,{user:currentUser,onAction:p=>act({type:'navigate',page:p})});
      }
    }
  };

  return React.createElement('div',{className:'app'},
    React.createElement(Notification,{...notification,onClose:()=>act({type:'clearNotify'})}),
    React.createElement(Sidebar,{user:currentUser,page,onNav:p=>act({type:'navigate',page:p}),onLogout:()=>act({type:'logout'})}),
    React.createElement('div',{className:'main'},
      React.createElement('div',{className:'topbar'},
        React.createElement('h1',null,topbarTitles[page]||'BilaSodhi'),
        React.createElement('div',{className:'topbar-actions'},
          React.createElement('div',{style:{fontSize:12,color:'#6b7280',background:'#f3f4f6',padding:'6px 12px',borderRadius:8}},currentUser.role==='admin'?'Admin':'Member'),
          React.createElement('div',{style:{width:32,height:32,borderRadius:'50%',background:'#eff6ff',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'},onClick:()=>act({type:'navigate',page:'profile'})},
            React.createElement(Avatar,{name:currentUser.name,size:32})
          )
        )
      ),
      React.createElement('div',{className:'content'},renderPage())
    )
  );
}

ReactDOM.render(React.createElement(App),document.getElementById('root'));
</script>
